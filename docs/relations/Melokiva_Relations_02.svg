<text x="60" y="57" font-size="34" font-weight="800" font-family="DejaVu Sans,Arial" fill="#15233D">MELOKIVA  |  Qui crée quoi, quand et avec quels droits ?</text>
<text x="62" y="86" font-size="16" font-family="DejaVu Sans,Arial" fill="#51627D">PARCOURS 02 · Carte de référence des relations métier  ·  État actuel et prochaines extensions</text>
<rect x="58" y="191" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="204" width="43" height="55" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="82" y="237.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">01</text>
<rect x="123" y="204" width="278" height="57" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="137" y="238.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Personne ↔ Personne</text>
<rect x="420" y="199" width="496" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="434" y="239.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Un message est envoyé ; réponse réciproque, ou rencontre</text>
<text x="434" y="254.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">confirmée en jam.</text>
<rect x="938" y="199" width="323" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="952" y="239.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Conversation / Contact</text>
<rect x="1281" y="199" width="312" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="1295" y="239.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Blocage et visibilité ; contact ≠</text>
<text x="1295" y="253.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">collaboration.</text>
<rect x="58" y="287" width="1542" height="87" rx="15" fill="#F5F7FB" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="300" width="43" height="55" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="82" y="333.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">02</text>
<rect x="123" y="300" width="278" height="57" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="137" y="334.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Personne ↔ Jam</text>
<rect x="420" y="295" width="496" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="434" y="335.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Inscription ou invitation ; la présence effective est un</text>
<text x="434" y="350.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">fait distinct.</text>
<rect x="938" y="295" width="323" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="952" y="335.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Participation / présence</text>
<rect x="1281" y="295" width="312" height="69" rx="15" fill="#E7F7EF" stroke="#168469" stroke-width="1.6" />
<text x="1295" y="335.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Pas de preuve de présence par la seule</text>
<text x="1295" y="349.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">inscription.</text>
<rect x="58" y="383" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="396" width="43" height="55" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="82" y="429.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">03</text>
<rect x="123" y="396" width="278" height="57" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="137" y="430.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Personne ↔ Groupe</text>
<rect x="420" y="391" width="496" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="434" y="431.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Invitation acceptée ou demande acceptée par la gestion.</text>
<rect x="938" y="391" width="323" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="952" y="431.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Membership (rôle + période)</text>
<rect x="1281" y="391" width="312" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="1295" y="431.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Être membre ne donne pas accès aux</text>
<text x="1295" y="445.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">projets ou aux morceaux privés.</text>
<rect x="58" y="479" width="1542" height="87" rx="15" fill="#F5F7FB" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="492" width="43" height="55" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" />
<text x="82" y="525.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">04</text>
<rect x="123" y="492" width="278" height="57" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" />
<text x="137" y="526.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Personne ↔ Morceau</text>
<rect x="420" y="487" width="496" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" />
<text x="434" y="527.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">La gestion crédite ; chaque personne accepte son crédit</text>
<text x="434" y="542.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">(sauf cas autorisés).</text>
<rect x="938" y="487" width="323" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" />
<text x="952" y="527.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">WorkContributor / WorkRole</text>
<rect x="1281" y="487" width="312" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" />
<text x="1295" y="527.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Crédit, portage applicatif et droits</text>
<text x="1295" y="541.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">d’auteur sont différents.</text>
<rect x="58" y="575" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="588" width="43" height="55" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" />
<text x="82" y="621.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">05</text>
<rect x="123" y="588" width="278" height="57" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" />
<text x="137" y="622.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Personnes ↔ Collaboration</text>
<rect x="420" y="583" width="496" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" />
<text x="434" y="623.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Proposition → accord si future → confirmation par les</text>
<text x="434" y="638.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">parties après le fait.</text>
<rect x="938" y="583" width="323" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" />
<text x="952" y="623.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Collaboration confirmée</text>
<rect x="1281" y="583" width="312" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" />
<text x="1295" y="623.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Seule la confirmation éligible déclenche</text>
<text x="1295" y="637.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">les preuves / XP associées.</text>
<rect x="58" y="671" width="1542" height="87" rx="15" fill="#F5F7FB" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="684" width="43" height="55" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="82" y="717.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">06</text>
<rect x="123" y="684" width="278" height="57" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="137" y="718.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Acteur ↔ Projet</text>
<rect x="420" y="679" width="496" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="434" y="719.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">La personne ou la gestion d’une organisation crée un</text>
<text x="434" y="734.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">objectif.</text>
<rect x="938" y="679" width="323" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="952" y="719.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Project (porteur unique)</text>
<rect x="1281" y="679" width="312" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="1295" y="719.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Projet facultatif ; aucun crédit ni XP</text>
<text x="1295" y="733.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">pour sa création.</text>
<rect x="58" y="767" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="780" width="43" height="55" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="82" y="813.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">07</text>
<rect x="123" y="780" width="278" height="57" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="137" y="814.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Projet ↔ Morceau</text>
<rect x="420" y="775" width="496" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="434" y="815.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">La gestion du projet ET du morceau autorise le rangement</text>
<text x="434" y="830.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">(P2).</text>
<rect x="938" y="775" width="323" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="952" y="815.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">ProjectItem + partage</text>
<rect x="1281" y="775" width="312" height="69" rx="15" fill="#EAF2FF" stroke="#2467C9" stroke-width="1.6" />
<text x="1295" y="815.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">NONE masque ; SUMMARY résume ; WORK</text>
<text x="1295" y="829.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">prépare le travail.</text>
<rect x="58" y="863" width="1542" height="87" rx="15" fill="#F5F7FB" stroke="#D5DFED" stroke-width="0.5" stroke-dasharray="7 5"/>
<rect x="68" y="876" width="43" height="55" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="82" y="909.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">08</text>
<rect x="123" y="876" width="278" height="57" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="137" y="910.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Projet ↔ Participant</text>
<rect x="420" y="871" width="496" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="434" y="911.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Le porteur invite ; la personne accepte ; une capacité</text>
<text x="434" y="926.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">bornée est accordée.</text>
<rect x="938" y="871" width="323" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="952" y="911.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">ProjectParticipant</text>
<rect x="1281" y="871" width="312" height="69" rx="15" fill="#F3ECFF" stroke="#7848C5" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1295" y="911.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">P4/U3 à construire ; participation sans</text>
<text x="1295" y="925.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">droits implicites sur le morceau.</text>
<rect x="58" y="959" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" stroke-dasharray="7 5"/>
<rect x="68" y="972" width="43" height="55" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="82" y="1005.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">09</text>
<rect x="123" y="972" width="278" height="57" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="137" y="1006.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Projet ↔ Travail confié</text>
<rect x="420" y="967" width="496" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="434" y="1007.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Un responsable confie une tâche sur un élément partagé et</text>
<text x="434" y="1022.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">autorisé.</text>
<rect x="938" y="967" width="323" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="952" y="1007.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Tâche / livrable / validation</text>
<rect x="1281" y="967" width="312" height="69" rx="15" fill="#FFF0DF" stroke="#C56A25" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1295" y="1007.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">P13/U5 prévu ; la tâche ne confirme pas</text>
<text x="1295" y="1021.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">d’office une collaboration.</text>
<rect x="58" y="1055" width="1542" height="87" rx="15" fill="#F5F7FB" stroke="#D5DFED" stroke-width="0.5" />
<rect x="68" y="1068" width="43" height="55" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" />
<text x="82" y="1101.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">10</text>
<rect x="123" y="1068" width="278" height="57" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" />
<text x="137" y="1102.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Structure ↔ Événement</text>
<rect x="420" y="1063" width="496" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" />
<text x="434" y="1103.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Un lieu ou organisateur publie / accueille une date et</text>
<text x="434" y="1118.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">confirme le concert.</text>
<rect x="938" y="1063" width="323" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" />
<text x="952" y="1103.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Lieu / hôte / concert</text>
<rect x="1281" y="1063" width="312" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" />
<text x="1295" y="1103.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Concert ≠ jam ; agenda culturel</text>
<text x="1295" y="1117.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">généraliste en extension.</text>
<rect x="58" y="1151" width="1542" height="87" rx="15" fill="#EDF4FF" stroke="#D5DFED" stroke-width="0.5" stroke-dasharray="7 5"/>
<rect x="68" y="1164" width="43" height="55" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="82" y="1197.5" font-size="19" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">11</text>
<rect x="123" y="1164" width="278" height="57" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="137" y="1198.5" font-size="15" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Public ↔ Événement</text>
<rect x="420" y="1159" width="496" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="434" y="1199.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Après participation à un événement public : retour</text>
<text x="434" y="1214.71" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">d’expérience envisagé.</text>
<rect x="938" y="1159" width="323" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="952" y="1199.5" font-size="13" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">Avis de spectateur</text>
<rect x="1281" y="1159" width="312" height="69" rx="15" fill="#E4F7F7" stroke="#137E89" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="1295" y="1199.5" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">#86 — futur rôle / facette, anti-abus et</text>
<text x="1295" y="1213.54" font-size="12" font-weight="700" font-family="DejaVu Sans,Arial" fill="#15233D">présence à arbitrer.</text>
<text x="60" y="118" font-family="DejaVu Sans,Arial" font-weight="500" font-size="16" fill="#51627D">COMMENT LIRE : chaque ligne relie 2 objets, le déclencheur réel, ce qui est enregistré et la limite à respecter.</text>
<text x="65" y="166" font-family="DejaVu Sans,Arial" font-weight="500" font-size="15" fill="#15233D">RELATION</text>
<text x="420" y="166" font-family="DejaVu Sans,Arial" font-weight="500" font-size="15" fill="#15233D">QUAND ? / DÉCLENCHEUR</text>
<text x="944" y="166" font-family="DejaVu Sans,Arial" font-weight="500" font-size="15" fill="#15233D">CE QUI EXISTE</text>
<text x="1282" y="166" font-family="DejaVu Sans,Arial" font-weight="500" font-size="15" fill="#15233D">GARDE-FOU / CONSÉQUENCE</text>
<text x="64" y="1280" font-family="DejaVu Sans,Arial" font-weight="500" font-size="16" fill="#51627D">ÉTAT :   plein = existant   ·   contour pointillé = lot futur   ·   « partiel » = fonctionnalités présentes, extension prévue</text>
</svg>