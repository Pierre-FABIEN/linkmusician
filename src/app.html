<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="32x32" />
		<!-- LINKMUSICIAN: icônes et app installée sur mobile (P0-07, D24). -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="LinkMusician" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

		<!-- Pas de meta description/keywords/robots/OG/Twitter/canonical statique
		     ici : `#lib/components/SEO.svelte` (`#lib/seo.config.ts`) les pose
		     dynamiquement sur chaque page, injectées juste en dessous. Un
		     doublon ici entrait en conflit avec elles (ex: `noindex` posé par
		     une page à côté d'un `index, follow` figé ici) plutôt que de servir
		     de repli, et resservait par-dessus le marché un texte "studio web"
		     resté d'un ancien boilerplate — voir RESTE_A_FAIRE.md. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<main id="sveltekit-body-wrapper">%sveltekit.body%</main>
	</body>
</html>
